# Editable classification rules. No code change is needed to add a keyword.
# Rules resolve conflicts by priority, then specificity (longer match), then direction.
version: 1

rules:
  - id: salary_credit
    category: Salary/Income
    priority: 130
    direction: credit
    keywords:
      - SALARY
      - SAL CR
      - SALCR
      - SALARY CREDIT
      - MONTHLY SALARY
      - PAYROLL
      - WAGES
      - STIPEND
      - ARREARS
      - SALARY PAYMENT
    reason: salary credit

  - id: business_income
    category: Business Income
    priority: 100
    direction: credit
